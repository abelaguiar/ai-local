<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName local.chatbot

    SSLEngine on
    SSLCertificateFile /etc/ssl/local.chatbot/local.chatbot.crt
    SSLCertificateKeyFile /etc/ssl/local.chatbot/local.chatbot.key

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 600

    ProxyPass /manifest.json !
    Alias /manifest.json /var/www/local.chatbot-manifest.json

    <Directory /var/www>
        Require all granted
    </Directory>

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass /ws/socket.io/ ws://127.0.0.1:38127/ws/socket.io/ retry=0 timeout=600
    ProxyPassReverse /ws/socket.io/ ws://127.0.0.1:38127/ws/socket.io/

    ProxyPass / http://127.0.0.1:38127/ retry=0 timeout=600 keepalive=On
    ProxyPassReverse / http://127.0.0.1:38127/

    ErrorLog ${APACHE_LOG_DIR}/local.chatbot-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/local.chatbot-ssl-access.log combined
</VirtualHost>
</IfModule>
