services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-local-ollama
    restart: unless-stopped
    network_mode: host
    gpus: all
    environment:
      OLLAMA_HOST: "${OLLAMA_HOST:-127.0.0.1:11434}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-10m}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-1}"
      OLLAMA_FLASH_ATTENTION: "${OLLAMA_FLASH_ATTENTION:-1}"
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}"
    volumes:
      - "${OLLAMA_MODELS:-./models}:/root/.ollama"

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile.open-webui
    image: ai-local-open-webui:dev
    container_name: ai-local-open-webui
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "${OPEN_WEBUI_PORT:-38127}"
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      WEBUI_AUTH: "True"
    depends_on:
      - ollama
    volumes:
      - ./open-webui-data:/app/backend/data
      - /home/abel-aguiar/projects:/host/projects:ro
      - /home/abel-aguiar/projects/ai-generated:/workspace:rw
