services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ai-local-open-webui
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "${OPEN_WEBUI_PORT:-38127}"
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      WEBUI_AUTH: "True"
    volumes:
      - ./open-webui-data:/app/backend/data
      - /home/abel-aguiar/projects:/host/projects:ro
